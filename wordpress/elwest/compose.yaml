services:
  mariadb:
    image: mariadb@sha256:dd9b303aed4f4890ed09f766d8ca9ddfd176c0c6f6267feff53b3192ec65a979
    container_name: wordpress-elwest-mariadb
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
    volumes:
      - ${DB_DATA_ROOT}:/var/lib/mysql
    networks:
      private:
        aliases:
          - wordpress-db

  wordpress:
    image: wordpress@sha256:5a93c470ae8220fddf71f6ebe3bc94e615ddc2ae4d9810f795b830fb11c41a17
    container_name: wordpress-elwest-wordpress
    restart: unless-stopped
    ports:
      - "8144:80"
    environment:
      WORDPRESS_DB_HOST: wordpress-db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD}
      WORDPRESS_DB_NAME: wordpress
    depends_on:
      mariadb:
        condition: service_started
    volumes:
      - ${WORDPRESS_DATA_ROOT}:/var/www/html
    networks:
      - private
      - public

networks:
  private:
    internal: true
  public:
