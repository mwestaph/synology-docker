services:

  postgres:
    image: pgvector/pgvector:pg18
    container_name: bookorbit-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookorbit
      POSTGRES_PASSWORD: ${BOOKORBIT_DB_PASSWORD}
      POSTGRES_DB: bookorbit
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - /volumeUSB1/usbshare/docker/appdata/bookorbit/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookorbit -d bookorbit"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - bookorbit_private

  bookorbit:
    image: ghcr.io/bookorbit/bookorbit:latest
    container_name: bookorbit
    restart: unless-stopped
    labels:
     - "wud.watch.digest=true"
     - "wud.trigger.docker.local.enabled=true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8150:3000"
    environment:
      APP_URL: "http://192.168.1.10:8150"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: bookorbit
      POSTGRES_PASSWORD: ${BOOKORBIT_DB_PASSWORD}
      POSTGRES_DB: bookorbit
      JWT_SECRET: ${BOOKORBIT_JWT_SECRET}
      SETUP_BOOTSTRAP_TOKEN: ${BOOKORBIT_SETUP_BOOTSTRAP_TOKEN}
      BOOK_REQUEST_ENCRYPTION_KEY: ${BOOKORBIT_REQUEST_ENCRYPTION_KEY}
      PORT: "3000"
      BOOKS_PATH: /books
      LIBRARY_BROWSE_ROOT: /books
      PUID: "1026"
      PGID: "100"
    volumes:
      - /volumeUSB1/usbshare/docker/appdata/bookorbit/app:/data
      - /volume1/Plex/BookOrbit:/books
      - /volume1/Downloads:/downloads
    networks:
      - bookorbit_private
      - media_net

  calibre:
    image: lscr.io/linuxserver/calibre:latest
    container_name: books-calibre
    labels:
     - "wud.watch.digest=true"
     - "wud.trigger.docker.local.enabled=true"
    environment:
      PGID: "100"
      PUID: "1024"
      TZ: America/Los_Angeles
    networks:
      - media_net
    ports:
      - "8142:8080"
      - "8143:8181"
    restart: unless-stopped
    volumes:
      - /volumeUSB1/usbshare/docker/appdata/calibre:/config
      - /volume1/Downloads/qbittorrent/completed:/import
      - /volume1/Plex/Books:/books

  kapowarr:
    image: mrcas/kapowarr:latest
    container_name: books-kapowarr
    labels:
     - "wud.watch.digest=true"
     - "wud.trigger.docker.local.enabled=true"
    environment:
      PGID: "100"
      PUID: "1024"
      TZ: America/Los_Angeles
    networks:
      - media_net
    ports:
      - "8136:5656"
    restart: unless-stopped
    volumes:
      - /volumeUSB1/usbshare/docker/appdata/kapowarr:/app/db
      - /volume1/Downloads:/app/temp_downloads
      - /volume1/Plex/Comics:/comics

  komga:
    image: gotson/komga:latest
    container_name: books-komga
    labels:
     - "wud.watch.digest=true"
     - "wud.trigger.docker.local.enabled=true"
    environment:
      TZ: America/Los_Angeles
    networks:
      - media_net
    ports:
      - "25600:25600"
    restart: unless-stopped
    volumes:
      - /volumeUSB1/usbshare/docker/appdata/komga:/config
      - /volume1/Plex/Comics:/comics

  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:latest
    container_name: books-lazylibrarian
    labels:
     - "wud.watch.digest=true"
     - "wud.trigger.docker.local.enabled=true"
    environment:
      PGID: "100"
      PUID: "1024"
      TZ: America/Los_Angeles
    networks:
      - media_net
    ports:
      - "8140:5299"
    restart: unless-stopped
    volumes:
      - /volumeUSB1/usbshare/docker/appdata/lazylibrarian:/config
      - /volume1/Downloads:/downloads
      - /volume1/Plex/Audiobooks:/audiobooks
      - /volume1/Plex/Books:/books

networks:
  media_net:
    external: true
  bookorbit_private:
    internal: true

