services:

  beszel:
    image: henrygd/beszel:latest
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    container_name: beszel
    restart: unless-stopped
    ports:
      - "8146:8090"
    volumes:
      - /volumeUSB1/usbshare/docker/appdata/beszel:/beszel_data
      - /volumeUSB1/usbshare/docker/appdata/beszel/socket:/beszel_socket

  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    volumes:
      - /volumeUSB1/usbshare/docker/appdata/beszel/agent:/var/lib/beszel-agent
      - /volumeUSB1/usbshare/docker/appdata/beszel/socket:/beszel_socket
      - /volume1/.beszel:/extra-filesystems/volume1__Main:ro
      - /volumeUSB1/usbshare/.beszel:/extra-filesystems/usbshare__USB:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://beszel:8090
      KEY: ${BESZEL_KEY}
      TOKEN: ${BESZEL_TOKEN}

  dashdot:
    image: mauricenino/dashdot:latest
    container_name: utilities-dashdot
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      DASHDOT_ENABLE_CPU_TEMPS: "true"
    networks:
      - media_net
    ports:
      - "8124:3001"
    restart: unless-stopped
    volumes:
      - /:/mnt/host:ro

  dupeguru:
    image: jlesage/dupeguru:latest
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    container_name: utilities-dupeguru
    environment:
      DISPLAY_HEIGHT: "900"
      DISPLAY_WIDTH: "1600"
      GROUP_ID: "100"
      TZ: America/Los_Angeles
      USER_ID: "1024"
    networks:
      - media_net
    ports:
      - "8138:5800"
    restart: unless-stopped
    volumes:
      - /volumeUSB1/usbshare/docker/appdata/dupeguru:/config
      - /volumeUSB1/usbshare/docker/appdata/dupeguru/trash:/trash
      - /volume1:/storage

  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: utilities-homarr
    environment:
      SECRET_ENCRYPTION_KEY: ${SECRET_ENCRYPTION_KEY}
      TZ: America/Los_Angeles
    labels:
      - "wud.trigger.include=docker.local"
    networks:
      - media_net
    ports:
      - "8122:7575"
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volumeUSB1/usbshare/docker/appdata/homarr:/appdata

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-new
    restart: unless-stopped

    environment:
      TZ: America/Los_Angeles
      WATCHTOWER_SCHEDULE: "0 30 3 * * *"
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_CLEANUP: "false"
      WATCHTOWER_REMOVE_VOLUMES: "false"
      WATCHTOWER_NO_STARTUP_MESSAGE: "true"

      WATCHTOWER_NOTIFICATIONS: email
      WATCHTOWER_NOTIFICATION_EMAIL_FROM: ${NOTIFICATION_EMAIL}
      WATCHTOWER_NOTIFICATION_EMAIL_TO: ${NOTIFICATION_EMAIL}
      WATCHTOWER_NOTIFICATION_EMAIL_SERVER: smtp.gmail.com
      WATCHTOWER_NOTIFICATION_EMAIL_PORT: "587"
      WATCHTOWER_NOTIFICATION_EMAIL_USERNAME: ${NOTIFICATION_EMAIL}
      WATCHTOWER_NOTIFICATION_EMAIL_PASSWORD: ${WATCHTOWER_EMAIL_PASSWORD}
      WATCHTOWER_NOTIFICATION_EMAIL_DELAY: "2"
      WATCHTOWER_NOTIFICATION_EMAIL_TLS_SKIP_VERIFY: "false"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  wud:
    image: getwud/wud:latest
    container_name: wud
    restart: unless-stopped
    environment:
      - TZ=America/Los_Angeles
      - WUD_LOG_LEVEL=info
      - WUD_SERVER_PORT=3000
      - WUD_TRIGGER_DOCKER_LOCAL_AUTO=true
      - WUD_TRIGGER_DOCKER_LOCAL_INCLUDEBYDEFAULT=false
      - WUD_TRIGGER_DOCKER_LOCAL_PRUNE=false
      - WUD_TRIGGER_DOCKER_LOCAL_ROLLBACK=true
      - WUD_TRIGGER_DOCKER_LOCAL_ROLLBACKGRACE=30000
      - WUD_WATCHER_LOCAL_WATCHATSTART=false
      - WUD_WATCHER_LOCAL_WATCHEVENTS=false
      - WUD_TRIGGER_SMTP_GMAIL_HOST=smtp.gmail.com
      - WUD_TRIGGER_SMTP_GMAIL_PORT=465
      - WUD_TRIGGER_SMTP_GMAIL_TLS_ENABLED=true
      - WUD_TRIGGER_SMTP_GMAIL_USER=${WUD_SMTP_USER}
      - WUD_TRIGGER_SMTP_GMAIL_PASS=${WUD_SMTP_PASSWORD}
      - WUD_TRIGGER_SMTP_GMAIL_FROM_ADDRESS=${WUD_SMTP_USER}
      - WUD_TRIGGER_SMTP_GMAIL_TO=${WUD_SMTP_TO}
      - WUD_WATCHER_LOCAL_CRON=0 0 4 * * *
      - WUD_AUTH_ADMIN_USER=${WUD_ADMIN_USER}
      - WUD_AUTH_ADMIN_PASSWORD=${WUD_ADMIN_PASSWORD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volumeUSB1/usbshare/docker/appdata/wud:/store
    ports:
      - "3001:3000"

networks:
  media_net:
    external: true
