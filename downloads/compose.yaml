services:
  gluetun:
    image: qmcgaw/gluetun:v3.41.3
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      FIREWALL: "on"
      FIREWALL_INPUT_PORTS: "8090,8080,9999,8888"
      FIREWALL_OUTBOUND_SUBNETS: ${LAN_SUBNET}
      VPN_TYPE: wireguard
      WIREGUARD_ENDPOINT_IP: ${WIREGUARD_ENDPOINT_IP}
      WIREGUARD_ENDPOINT_PORT: ${WIREGUARD_ENDPOINT_PORT}
      WIREGUARD_PUBLIC_KEY: ${WIREGUARD_PUBLIC_KEY}
      WIREGUARD_PRIVATE_KEY: ${WIREGUARD_PRIVATE_KEY}
      WIREGUARD_ADDRESSES: ${WIREGUARD_ADDRESSES}
      SERVER_IPS: ${WIREGUARD_ENDPOINT_IP}
      VPN_SERVICE_PROVIDER: custom
      TZ: ${TZ}
      VPN_PORT_FORWARDING: "on"
      VPN_PORT_FORWARDING_PROVIDER: protonvpn
      VPN_PORT_FORWARDING_STATUS_FILE: /tmp/gluetun/forwarded_port
      HTTP_HEALTH_SERVER_ADDRESS: ":9999"
      DNS_ADDRESS: 1.1.1.1
      DOT: "off"
      HEALTH_TARGET_ADDRESS: cloudflare.com:443
      HTTPPROXY: "on"
      HTTPPROXY_LOG: "on"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9999/"]
      timeout: 5s
      interval: 15s
      retries: 10
      start_period: 20s
    ports:
      - "8090:8090"
      - "9999:9999"
      - "8888:8888"
    volumes:
      - ${APPDATA_ROOT}/gluetun:/gluetun
    networks:
      - media_net
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:5.1.4-r2-ls445
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
      WEBUI_PORT: "8090"
    volumes:
      - ${APPDATA_ROOT}/qbittorrent:/config
      - ${APPDATA_ROOT}/qbittorrent/scripts/discord-webhook.sh:/scripts/discord-webhook.sh:ro
      - ${DOWNLOADS_ROOT}:/downloads
      - ${AUDIO_ROOT}:/audio
      - ${WRESTLING_ROOT}:/wrestling
      - ${MMA_ROOT}:/mma
    restart: unless-stopped

  qbitrr:
    image: feramance/qbitrr:latest
    # Keep the real config.toml private in ${APPDATA_ROOT}/qbitrr.
    environment:
      TZ: ${TZ}
    volumes:
      - ${APPDATA_ROOT}/qbitrr:/config
      - ${DOWNLOADS_ROOT}:/downloads
    ports:
      - "6969:6969"
    networks:
      - media_net
    restart: unless-stopped

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${APPDATA_ROOT}/sabnzbd:/config
      - ${DOWNLOADS_ROOT}:/downloads
    ports:
      - "8091:8080"
    networks:
      - media_net
    restart: unless-stopped

networks:
  media_net:
    external: true
