services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    labels:
     - "wud.trigger.include=docker.local,smtp.gmail"
     - "wud.watch.delay=24h"
    restart: unless-stopped
    stop_grace_period: 30s

    environment:
      PUID: "1024"
      PGID: "100"
      TZ: America/Los_Angeles

    ports:
      - "8135:6767"

    volumes:
      - /volumeUSB1/usbshare/docker/appdata/bazarr:/config
      - /volume1/Plex/Movies:/movies
      - /volume1/Plex/TV:/tv

    networks:
      - media_net

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest

    restart: unless-stopped
    labels:
     - "wud.trigger.include=docker.local,smtp.gmail"
     - "wud.watch.delay=24h"

    environment:
      LOG_LEVEL: info
      LOG_HTML: "false"
      TZ: America/Los_Angeles

    ports:
      - "8092:8191"

    networks:
      - media_net

  lidarr:
    image: ghcr.io/hotio/lidarr:pr-plugins
    restart: unless-stopped
    stop_grace_period: 30s

    environment:
      PUID: "1024"
      PGID: "100"
      TZ: America/Los_Angeles

    ports:
      - "8131:8686"

    volumes:
      - /volumeUSB1/usbshare/docker/appdata/lidarr:/config
      - /volume1/Plex/Audio/Music:/music
      - "/volume1/Plex/Audio/Holiday Music:/holiday music"
      - /volume1/Plex/Audio/_Incoming:/Incoming
      - /volume1/Downloads:/downloads

    networks:
      - media_net

  nzbhydra2:
    image: ghcr.io/linuxserver/nzbhydra2
    restart: unless-stopped
    stop_grace_period: 120s
    environment:
      PUID: "1024"
      PGID: "100"
      TZ: America/Los_Angeles
    labels:
     - "wud.trigger.include=docker.local,smtp.gmail"
     - "wud.watch.delay=24h"
    ports:
      - "5076:5076"

    volumes:
      - /volumeUSB1/usbshare/docker/appdata/nzbhydra2:/config

    networks:
      - media_net

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    labels:
     - "wud.trigger.include=docker.local,smtp.gmail"
     - "wud.watch.delay=24h"
    restart: unless-stopped
    stop_grace_period: 30s

    environment:
      PUID: "1024"
      PGID: "100"
      TZ: America/Los_Angeles
      PROWLARR__SERVER__PORT: "9696"
      PROWLARR__SERVER__BINDADDRESS: "*"

    ports:
      - "8130:9696"

    volumes:
      - /volumeUSB1/usbshare/docker/appdata/prowlarr:/config
      - /volume1/Downloads:/downloads

    networks:
      - media_net
      
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    labels:
     - "wud.trigger.include=docker.local,smtp.gmail"
     - "wud.watch.delay=24h"
    restart: unless-stopped
    stop_grace_period: 30s

    environment:
      PUID: "1024"
      PGID: "100"
      TZ: America/Los_Angeles

    ports:
      - "8132:7878"

    volumes:
      - /volumeUSB1/usbshare/docker/appdata/radarr:/config
      - /volume1/Downloads:/downloads
      - /volume1/Plex/Movies:/movies
      - /volume1/Plex/Boxing:/boxing
      - /volume1/Plex/Kickboxing:/kickboxing
      - /volume1/Plex/MMA:/mma
      - /volume1/Plex/Wrestling:/wrestling

    networks:
      - media_net
  
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    labels:
     - "wud.trigger.include=docker.local,smtp.gmail"
     - "wud.watch.delay=24h"
    restart: unless-stopped
    stop_grace_period: 30s

    environment:
      PUID: "1024"
      PGID: "100"
      TZ: America/Los_Angeles

    ports:
      - "8133:8989"

    volumes:
      - /volumeUSB1/usbshare/docker/appdata/sonarr:/config
      - /volume1/Plex/TV:/tv
      - /volume1/Downloads:/downloads
      - /volume1/Plex:/media

    networks:
      - media_net

  sportarr:
    image: sportarr/sportarr:latest
    labels:
      - wud.watch.digest=true
      - "wud.trigger.include=docker.local,smtp.gmail"
      - "wud.watch.delay=24h"
    restart: unless-stopped
    ports:
      - "1867:1867"
    environment:
      PUID: "1024"
      PGID: "100"
      UMASK: "022"
      TZ: America/Los_Angeles
    volumes:
      - /volumeUSB1/usbshare/docker/appdata/sportarr/config:/config
      - /volumeUSB1/usbshare/docker/appdata/sportarr/data:/data
      - /volume1/Downloads:/downloads
      - /volume1/Plex/Sports:/sports
      - /volume1/Plex/MMA/UFC:/UFC
      - /volume1/Plex/Sports/NFL:/NFL
      - /volume1/Plex/Sports/NCAAF:/NCAAF
      - "/volume1/Plex/Wrestling/WWE PPV:/WWE PPV"
      - "/volume1/Plex/Wrestling/AEW PPV:/AEW PPV"
      - /volume1/Plex/Wrestling/AAA:/AAA
    networks:
      - media_net
      
networks:
  media_net:
    external: true
