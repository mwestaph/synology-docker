services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    container_name: edge-cloudflared
    restart: unless-stopped
    command: tunnel --metrics 0.0.0.0:8082 --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    ports:
      - "8082:8082"
    networks:
      - public

  pihole:
    image: pihole/pihole:latest@sha256:f7d1be836e3bc608b56d82fc9904f5a831cdfbc0dc9c6d58f94e4c985c70038b
    container_name: edge-pihole
    restart: unless-stopped
    environment:
      TZ: America/Los_Angeles
      WEBPASSWORD: ${WEBPASSWORD}
    volumes:
     - /volume1/docker/appdata-recovery/edge/pihole:/etc/pihole
     - /volume1/docker/appdata-recovery/edge/pihole/etc-dnsmasq.d:/etc/dnsmasq.d
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"
    networks:
      - public

networks:
  public:
