services:
  channels-dvr:
    image: fancybits/channels-dvr:latest
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    network_mode: host
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    environment:
      TZ: America/Los_Angeles
    volumes:
      - /volumeUSB1/usbshare/docker/appdata/channels-dvr:/channels-dvr
      - /volume1/Plex/TV/Recordings/ChannelsDVR:/shares/DVR
  
  fileflows:
    image: revenz/fileflows:stable
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped
    ports:
      - "8141:5000"
    environment:
      TZ: America/Los_Angeles
      PUID: "1024"
      PGID: "100"
      TempPathHost: /volume1/Downloads/fileflows
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /volumeUSB1/usbshare/docker/appdata/fileflows:/app/Data
      - /volume1/Downloads/fileflows:/temp
    networks:
      - media_net

  plex:
    image: plexinc/pms-docker:latest
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    container_name: media-processing-plex
    network_mode: host
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri
    environment:
      TZ: America/Los_Angeles
      PLEX_UID: "297536"
      PLEX_GID: "297536"
    volumes:
      - /volumeUSB1/usbshare/docker/appdata/plex:/config
      - /volumeUSB1/usbshare/docker/appdata/plex/transcode:/transcode
      - /volume1/Plex:/volume1/Plex

  tautulli:
    image: lscr.io/linuxserver/tautulli:latest
    labels:
      - "wud.tag.include=^latest$"
      - "wud.watch.digest=true"
      - "com.centurylinklabs.watchtower.enable=true"
    restart: unless-stopped
    ports:
      - "8121:8181"
    environment:
      PUID: "1024"
      PGID: "100"
      TZ: America/Los_Angeles
    volumes:
      - /volumeUSB1/usbshare/docker/appdata/tautulli:/config
    networks:
      - media_net

networks:
  media_net:
    external: true
